<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 纸张阴影 -->
    <filter id="paper-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.07" />
    </filter>

    <!-- 半调网点 -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#18181b" fill-opacity="0.06" />
      <circle cx="8" cy="8" r="1" fill="#18181b" fill-opacity="0.04" />
    </pattern>

    <!-- 网格蓝图 -->
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2563eb" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- 1. 底层：做旧牛皮纸/报纸基底 -->
  <rect width="1280" height="720" fill="#f4efe6" />
  
  <!-- 网格纹理区域 -->
  <rect x="60" y="50" width="1160" height="620" fill="url(#grid-pattern)" />
  <rect x="0" y="0" width="1280" height="720" fill="url(#halftone)" />

  <!-- 装饰性复古边框线条 -->
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="#18181b" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- 2. 背景层拼贴切片：浅牛皮色倾斜纸片 -->
  <g transform="rotate(-1.5 640 360)">
    <polygon points="120,110 1140,80 1170,610 90,590" fill="#eae1d2" filter="url(#subtle-shadow)" />
  </g>

  <!-- 3. 背景技术图纸切片 (蓝图片段) -->
  <g transform="translate(740, 110) rotate(2.5)">
    <rect width="420" height="490" fill="#fdfbf7" filter="url(#paper-shadow)" />
    <!-- 撕纸边缘微锯齿 (手工撕裂质感) -->
    <path d="M 0 0 Q 30 4 60 1 Q 100 6 150 0 Q 210 5 280 1 Q 350 4 420 0 L 420 490 Q 380 487 320 492 Q 250 488 180 491 Q 100 486 0 490 Z" fill="#faf6ee" />
    
    <!-- 内部系统技术排线与文字切片 -->
    <g opacity="0.45" transform="translate(30, 40)">
      <text x="0" y="20" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#2563eb" letter-spacing="1.5">SYS.SPEC // ARCHITECTURE_MAP</text>
      <line x1="0" y1="32" x2="360" y2="32" stroke="#2563eb" stroke-width="1.5" />
      
      <!-- 模拟内存与磁盘方块分布图 -->
      <rect x="0" y="50" width="165" height="90" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 2" />
      <text x="12" y="75" font-family="'Consolas', monospace" font-size="10" fill="#18181b">PAGEFILE: 4~8GB</text>
      <text x="12" y="95" font-family="'Consolas', monospace" font-size="10" fill="#18181b">COMMIT: SAFE</text>
      <text x="12" y="115" font-family="'Consolas', monospace" font-size="10" fill="#2563eb" font-weight="bold">RECLAIMED: +10GB</text>

      <rect x="185" y="50" width="175" height="90" fill="#18181b" fill-opacity="0.04" stroke="#18181b" stroke-width="1" />
      <text x="197" y="75" font-family="'Consolas', monospace" font-size="10" fill="#18181b">DRIVERSTORE</text>
      <text x="197" y="95" font-family="'Consolas', monospace" font-size="10" fill="#18181b">PNPUTIL: NO_FORCE</text>
      <text x="197" y="115" font-family="'Consolas', monospace" font-size="10" fill="#18181b" font-weight="bold">STATUS: PROTECTED</text>

      <rect x="0" y="160" width="360" height="70" fill="#f4efe6" stroke="#18181b" stroke-width="0.8" />
      <text x="15" y="185" font-family="'Consolas', monospace" font-size="10" fill="#18181b">UNREAL_ENGINE // OPTIONAL_4K_PAKS</text>
      <text x="15" y="205" font-family="'Consolas', monospace" font-size="12" fill="#dc2626" font-weight="bold">DELTA FORCE: -23.11 GB [STRIPPED]</text>

      <!-- 蓝图网格小图样 -->
      <circle cx="180" cy="320" r="60" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="6 3" />
      <circle cx="180" cy="320" r="35" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <line x1="100" y1="320" x2="260" y2="320" stroke="#2563eb" stroke-width="0.8" />
      <line x1="180" y1="240" x2="180" y2="400" stroke="#2563eb" stroke-width="0.8" />
    </g>

    <!-- 顶部半透明固定黄色和纸胶带 -->
    <rect x="140" y="-18" width="140" height="34" fill="#dfd2b5" fill-opacity="0.85" transform="rotate(-3 210 0)" />
  </g>

  <!-- 4. 主视觉手撕报纸纸片 (主标题大撕纸条) -->
  <g transform="translate(100, 150) rotate(-1)">
    <!-- 撕裂纸张主体 (多边形锯齿边缘) -->
    <polygon points="
      0,0 45,4 95,-2 160,3 230,-3 320,4 420,-2 520,3 620,-1 680,2 720,0 
      722,280 675,277 620,283 540,278 450,282 360,277 270,283 180,278 90,282 0,280
    " fill="#ffffff" filter="url(#paper-shadow)" />

    <!-- 纸张上的手写批注/分类标签 -->
    <rect x="40" y="32" width="130" height="24" fill="#18181b" />
    <text x="48" y="48" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">WINDOWS OS</text>

    <text x="185" y="49" font-family="'Consolas', monospace" font-size="11" fill="#71717a" letter-spacing="1">SYSTEM PURIFIER // V1.0</text>

    <!-- 核心大标题：WIN-PURIFY -->
    <text x="36" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="900" fill="#18181b" letter-spacing="-2">Win-Purify</text>

    <!-- 中文副标题排版 -->
    <text x="40" y="200" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#27272a" letter-spacing="1">Windows 极限减负与系统净化工具</text>
    
    <!-- 紧凑说明排版 -->
    <text x="40" y="240" font-family="'Consolas', 'PingFang SC', monospace" font-size="13" fill="#52525b">
      DRIVERSTORE PRUNE · UE OPTIONAL PAKS · DEV CACHE DEHYDRATION · 0-RISK
    </text>

    <!-- 固定左侧的半透明和纸胶带 -->
    <rect x="-25" y="90" width="45" height="110" fill="#dfd2b5" fill-opacity="0.82" transform="rotate(-6 0 140)" />
  </g>

  <!-- 5. 底部信息撕纸条：实测数据对比贴片 -->
  <g transform="translate(130, 480) rotate(1.2)">
    <polygon points="
      0,0 80,3 170,-2 260,2 350,-1 440,3 530,0 580,2
      580,120 500,118 410,123 310,117 210,122 110,117 0,120
    " fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#subtle-shadow)" />
    
    <text x="25" y="34" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#2563eb">BENCHMARK // REAL RECLAIM</text>
    
    <!-- 数据项 -->
    <text x="25" y="70" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#18181b">+76.08 GB</text>
    <text x="25" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">C: DRIVE FREED</text>

    <line x1="170" y1="50" x2="170" y2="100" stroke="#e2e8f0" stroke-width="1.5" />

    <text x="195" y="70" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#18181b">-4.6 GB</text>
    <text x="195" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">BOOT RAM OCCUPIED</text>

    <line x1="340" y1="50" x2="340" y2="100" stroke="#e2e8f0" stroke-width="1.5" />

    <text x="365" y="70" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#16a34a">100%</text>
    <text x="365" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">ANTI-CHEAT SAFE</text>
  </g>

  <!-- 6. 专属个人 IP 头像元素印章：复古红色火漆/橡胶印章与趴着睡觉的小黑猫 -->
  <g transform="translate(1040, 520) rotate(-4)">
    <!-- 印章外圆与双边线 -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="14 4 4 4" opacity="0.88" />
    <circle cx="90" cy="90" r="74" fill="none" stroke="#dc2626" stroke-width="1.2" opacity="0.88" />
    
    <!-- 环形印章英文 -->
    <path id="stamp-arc" d="M 30,90 A 60,60 0 1,1 150,90" fill="none" />
    <text font-family="'Consolas', monospace" font-size="9.5" font-weight="bold" fill="#dc2626" opacity="0.85" letter-spacing="2">
      <textPath href="#stamp-arc" startOffset="50%" text-anchor="middle">AAYUBAL LABS</textPath>
    </text>

    <path id="stamp-arc-bottom" d="M 150,90 A 60,60 0 0,1 30,90" fill="none" />
    <text font-family="'Consolas', monospace" font-size="9" font-weight="bold" fill="#dc2626" opacity="0.85" letter-spacing="2">
      <textPath href="#stamp-arc-bottom" startOffset="50%" text-anchor="middle">VERIFIED // 2026</textPath>
    </text>

    <!-- 趴着睡觉的小黑猫核心图形 (粉笔/喷绘质感圆润身体，白色内耳窝，眯缝眼，z z z) -->
    <!-- 地平线 -->
    <line x1="45" y1="112" x2="135" y2="112" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- 圆润黑色猫咪身体趴卧 -->
    <path d="M 52,112 C 50,96 64,82 82,82 C 92,82 104,87 112,94 C 122,96 130,103 128,112 Z" fill="#18181b" />

    <!-- 猫耳朵 -->
    <!-- 左耳 -->
    <polygon points="62,86 70,72 78,84" fill="#18181b" />
    <polygon points="65,84 70,75 75,83" fill="#ffffff" />
    <!-- 右耳 -->
    <polygon points="86,84 94,72 102,86" fill="#18181b" />
    <polygon points="89,83 94,75 99,84" fill="#ffffff" />

    <!-- 闭眼眯缝线 (白色的睡眼线) -->
    <path d="M 68,98 Q 74,101 80,98" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 86,98 Q 92,101 98,98" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- 呼呼大睡的 z z z -->
    <text x="108" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" opacity="0.9">z</text>
    <text x="116" y="70" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" opacity="0.9">z</text>
    <text x="126" y="58" font-family="'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold" fill="#dc2626" opacity="0.9">z</text>

    <!-- 右上角小胶带固定印章贴纸 -->
    <rect x="75" y="-12" width="55" height="24" fill="#dfd2b5" fill-opacity="0.8" transform="rotate(22 90 0)" />
  </g>

  <!-- 7. 右下角复古质感条形码 -->
  <g transform="translate(1000, 640)" opacity="0.4">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#18181b" stroke-width="3" />
    <line x1="6" y1="0" x2="6" y2="28" stroke="#18181b" stroke-width="1.5" />
    <line x1="12" y1="0" x2="12" y2="28" stroke="#18181b" stroke-width="4" />
    <line x1="20" y1="0" x2="20" y2="28" stroke="#18181b" stroke-width="1" />
    <line x1="25" y1="0" x2="25" y2="28" stroke="#18181b" stroke-width="3" />
    <line x1="33" y1="0" x2="33" y2="28" stroke="#18181b" stroke-width="1.5" />
    <line x1="40" y1="0" x2="40" y2="28" stroke="#18181b" stroke-width="4.5" />
    <line x1="50" y1="0" x2="50" y2="28" stroke="#18181b" stroke-width="2" />
    <line x1="56" y1="0" x2="56" y2="28" stroke="#18181b" stroke-width="1" />
    <line x1="62" y1="0" x2="62" y2="28" stroke="#18181b" stroke-width="3.5" />
    <line x1="72" y1="0" x2="72" y2="28" stroke="#18181b" stroke-width="2" />
    <line x1="80" y1="0" x2="80" y2="28" stroke="#18181b" stroke-width="1" />
    <line x1="88" y1="0" x2="88" y2="28" stroke="#18181b" stroke-width="3.5" />
    <line x1="98" y1="0" x2="98" y2="28" stroke="#18181b" stroke-width="2" />
    <text x="110" y="20" font-family="'Consolas', monospace" font-size="10" fill="#18181b">SN: 82BF-WINPURIFY</text>
  </g>
</svg>
